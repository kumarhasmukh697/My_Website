{% load static %}
<!-- Portfolio Section -->
<section id="portfolio" class="portfolio section light-background">

    <!-- Section Title -->
    <div class="container section-title">
    <h2>My Projects</h2>
    
    </div><!-- End Section Title -->

    <div class="container">

    <div class="isotope-layout" data-default-filter="*" data-layout="masonry" data-sort="original-order">

        <ul class="portfolio-filters isotope-filters">
        <li data-filter="*" class="filter-active">All</li>
        <li data-filter=".filter-app">App</li>
        </ul><!-- End Portfolio Filters -->

        <div class="row gy-4 isotope-container">
        
        {% for project in projects %}
        <div class="col-lg-4 col-md-6 portfolio-item isotope-item filter-app">
            <div class="portfolio-content h-100">
            <img src="{{ project.image.url }}" class="img-fluid" alt="App 1">
            <div class="portfolio-info">
                <h4>App 1</h4>
                <p>{{project.description|truncatewords:5}}</p>
                <a href="{{ project.image.url }}" title="App 1" data-gallery="portfolio-gallery-app" class="glightbox preview-link"><i class="bi bi-zoom-in"></i></a>
                <a href="{% url 'portfolio_details' project.id %}" title="More Details" class="details-link"><i class="bi bi-link-45deg"></i></a>
            </div>
            </div>
        </div><!-- End Portfolio Item -->
        {% endfor %}

        </div><!-- End Portfolio Container -->

    </div>

    </div>

</section>
<!-- /Portfolio Section -->
